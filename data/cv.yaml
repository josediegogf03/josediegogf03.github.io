name: "José Diego González Fernández"
role: "Mechanical Engineering"
profile: "Mechanical Engineering student with experience in mechanical design, structural FEA simulation, embedded systems, and telemetry: 3D CAD modeling and assembly in SolidWorks, C/C++ firmware for ESP32 with MQTT, PCB design in Altium, and data processing in Python. Team Captain of a 30-member team focused on developing an energy efficient EV."
