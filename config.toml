[[params.social]]
icon = "linkedin-in"
url = "https://www.linkedin.com/in/josediegogf03/"

[[params.social]]
icon = "github"
url = "https://github.com/josediegogf03"

sectionPagesMenu = 'main'


[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

