# Hugo Site Configuration
baseURL = "https://josediegogf03.github.io/"
languageCode = "en-us"
title = "José Diego González"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    contentDir = "content/en"
    languageName = "English"
    weight = 1
    [languages.en.params]
      tagline = "Mechanical Engineering Student."
      hero_description = "Mechanical Engineering student at Tecnológico de Monterrey and Team Co-captain of EcoVolt CCM, an energy-efficient electric vehicle team for Shell Eco-marathon. I work across mechanical design, telemetry and embedded systems, PCB design and simulation, and in 2026 I was a Visiting Student at MIT.nano."
      hero_location = "Mexico City, Mexico"
      resume_url = "/files/CV_EN.pdf"
      collab_tags = [
        "Mechanical design & CAD (SolidWorks)",
        "Telemetry & embedded systems (ESP32)",
        "PCB design (Altium Designer)",
        "Structural FEA & simulation",
        "Energy-efficient electric vehicles"
      ]
  [languages.es]
    contentDir = "content/es"
    languageName = "Español"
    weight = 2
    [languages.es.params]
      tagline = "Estudiante de Ingeniería Mecánica."
      hero_description = "Estudiante de Ingeniería Mecánica en el Tecnológico de Monterrey y co-capitán de EcoVolt CCM, equipo de un vehículo eléctrico de alta eficiencia para Shell Eco-marathon. Trabajo en diseño mecánico, telemetría y sistemas embebidos, diseño de PCB y simulación; en 2026 fui estudiante visitante en MIT.nano."
      hero_location = "Ciudad de México, MX"
      resume_url = "/files/CV_EN.pdf"
      collab_tags = [
        "Diseño mecánico y CAD (SolidWorks)",
        "Telemetría y sistemas embebidos (ESP32)",
        "Diseño de PCB (Altium Designer)",
        "Simulación y FEA estructural",
        "Vehículos eléctricos eficientes"
      ]
  [languages.fr]
    contentDir = "content/fr"
    languageName = "Français"
    weight = 3
    [languages.fr.params]
      tagline = "Étudiant en génie mécanique."
      hero_description = "Étudiant en génie mécanique au Tecnológico de Monterrey et co-capitaine d'EcoVolt CCM, équipe d'un véhicule électrique économe en énergie pour le Shell Eco-marathon. Je travaille la conception mécanique, la télémétrie et les systèmes embarqués, la conception de PCB et la simulation ; en 2026, j'ai été étudiant visiteur au MIT.nano."
      hero_location = "Mexico, MX"
      resume_url = "/files/CV_EN.pdf"
      collab_tags = [
        "Conception mécanique et CAO (SolidWorks)",
        "Télémétrie et systèmes embarqués (ESP32)",
        "Conception de PCB (Altium Designer)",
        "Simulation et éléments finis (structure)",
        "Véhicules électriques économes en énergie"
      ]

  [languages.de]
    contentDir = "content/de"
    languageName = "Deutsch"
    weight = 4
    [languages.de.params]
      tagline = "Maschinenbaustudent."
      hero_description = "Maschinenbaustudent am Tecnológico de Monterrey und Co-Kapitän von EcoVolt CCM, einem Team für ein energieeffizientes Elektrofahrzeug beim Shell Eco-marathon. Ich arbeite an mechanischer Konstruktion, Telemetrie und eingebetteten Systemen, Leiterplattenentwurf und Simulation; 2026 war ich Gaststudent am MIT.nano."
      hero_location = "Mexiko-Stadt, Mexiko"
      resume_url = "/files/CV_EN.pdf"
      collab_tags = [
        "Mechanische Konstruktion & CAD (SolidWorks)",
        "Telemetrie & eingebettete Systeme (ESP32)",
        "Leiterplattenentwurf (Altium Designer)",
        "Strukturelle FEM-Simulation",
        "Energieeffiziente Elektrofahrzeuge"
      ]
  [languages.it]
    contentDir = "content/it"
    languageName = "Italiano"
    weight = 5
    [languages.it.params]
      tagline = "Studente di Ingegneria Meccanica."
      hero_description = "Studente di Ingegneria Meccanica al Tecnológico de Monterrey e co-capitano di EcoVolt CCM, team di un veicolo elettrico ad alta efficienza energetica per lo Shell Eco-marathon. Mi occupo di progettazione meccanica, telemetria e sistemi embedded, progettazione di PCB e simulazione; nel 2026 sono stato studente ospite al MIT.nano."
      hero_location = "Città del Messico, Messico"
      resume_url = "/files/CV_EN.pdf"
      collab_tags = [
        "Progettazione meccanica e CAD (SolidWorks)",
        "Telemetria e sistemi embedded (ESP32)",
        "Progettazione PCB (Altium Designer)",
        "Simulazione FEM strutturale",
        "Veicoli elettrici ad alta efficienza"
      ]

[build]
  writeStats = true

[security]
  [security.node]
    [security.node.permissions]
      disable = true

